# Family agent settings. Nothing secret goes here: passwords, tokens and keys
# are environment secrets (see .env.example and docs/SETUP.md).
timezone: Europe/Helsinki

# Children as they should appear in calendar titles and the digest.
# `match` is matched (case-insensitive, start of name) against the names Wilma
# and MyClub show. Leave empty to use the first name each source gives.
children:
  - name: Oliver
    match: [Oliver, PPj]   # MyClub calendar subscription "PPj" (assumed Oliver's team)
  - name: Oskar
    match: [Oskar]

calendar:
  # Google calendar ids (Settings > the calendar > "Integrate calendar").
  # Ids are not secret, but they come from env vars so this file stays generic.
  family_calendar_id_env: GOOGLE_FAMILY_CALENDAR_ID   # "Anna Henri", the couple's shared calendar (was Perhe until 2026-10-25); human-owned; the chat agents may add events and edit only those they added (Henri, 2026-10-25)
  school_calendar_id_env: GOOGLE_SCHOOL_CALENDAR_ID   # "Family: School (Wilma)", agent writes
  hobbies_calendar_id_env: GOOGLE_HOBBIES_CALENDAR_ID # "Family: Hobbies (MyClub)", agent writes
  missing_runs_before_delete: 2
  max_deletes_per_run: 5

digest:
  language: fi            # en | fi (Henri, 2026-10-22)
  weekday_time: "06:45"
  weekend_time: "06:45"   # every day incl. weekends (Henri, 2026-10-22)
  week_ahead: { day: sun, time: "19:00" }
  coming_up_days: 7

alerts:
  quiet_hours: { from: "21:00", to: "06:30" }
  exam_soon_days: 3

wilma:
  enabled: true   # LIVE from the server (Henri, 2026-10-24); logs in directly, no laptop runner
  # Login = Anna's guardian account since 2026-10-25 (it sees both Oliver and
  # Oskar; Henri's saw only Oliver). A changed WILMA_USERNAME drops the old
  # session and re-learns silently (switchWilmaAccount).
  include_grades: false   # OPEN DECISION: default off (most sensitive data, never sent to Telegram)
  # 3-4 runs a day: every fresh login logs the account owner (Anna) out of Wilma in her browser.
  # The saved session is reused between runs to soften this.
  runs:
    - { days: [mon, tue, wed, thu, fri], time: "06:30" }
    - { days: [mon, tue, wed, thu, fri], time: "12:00", alerts: true }
    - { days: [mon, tue, wed, thu, fri], time: "16:00", alerts: true }
    - { days: [sun], time: "18:45", weekly: true }   # weekly: the week's Wilma summary per child to the family group (Henri, 2026-10-25)
  bulletin_events: true   # dated bulletin items go to the School calendar as tentative

myclub:
  enabled: true
  runs:
    - { days: [mon, tue, wed, thu, fri, sat, sun], time: "06:15" }
  horizon_weeks: 6
  # UNVERIFIED until the feasibility check with Henri. Either an ICS feed
  # (secret MYCLUB_ICS_URL) or the member pages read as Henri.
  mode: auto              # auto | ics | pages
  base_url: https://myclub.fi

# Weekly practice question. Sunday evening the bot posts a poll per child with
# next week's MyClub events; Monday morning the agent signs the ticked ones up
# in MyClub and declines the rest, then posts what it did. A poll nobody
# answered changes nothing. `live: false` = report only, until the MyClub
# sign-up step has been checked against the real pages.
# Family dashboard: one picture pinned in the family group (Kunto design), edited
# in place by the 15-minute tick whenever the calendars change. Needs Chromium on
# the server (CHROME_BIN or Playwright's) and the bot as group admin with "Pin
# messages". Off until the server thread has installed Chromium and sent the
# first one with `dashboard --send`.
dashboard:
  enabled: true    # on 2026-10-25: first picture sent; the tick retries the pin until the bot may pin
  # Henri's copy in Claude (artifact "Perheen viikko"): the page also goes to this
  # Drive file, "Perhe-dashboard.html" in janttiho@gmail.com's Drive, shared with
  # the service account as editor (2026-10-25). Needs the Drive API enabled in the
  # Google Cloud project.
  drive_file_id: 1yq_LTx-NVSEy37UB4rs_T8CdaYGtGF84

# Jobs the OpenClaw agents run instead of the 15-minute tick (openclaw/README.md
# "Moving the jobs to OpenClaw"). Step 3, 2026-10-25: attendance moved to agent
# `family` with inline buttons in the family group.
agent_jobs: [attendance-poll, attendance-apply]

# Helsinki schools' holidays (hel.fi "Koulujen ja oppilaitosten työ- ja loma-ajat",
# read 2026-10-25). The Chief of staff's holiday_plan tool plans trips around them.
# A principal may move one working day a year; Wilma bulletins say when.
school_holidays:
  - { name: Joululoma, from: "2026-12-21", to: "2027-01-06" }
  - { name: Talviloma, from: "2027-02-22", to: "2027-02-26" }
  - { name: Kesäloma, from: "2027-06-06", to: "2027-08-10" }
  - { name: Syysloma, from: "2027-10-18", to: "2027-10-22" }
  - { name: Joululoma, from: "2027-12-23", to: "2028-01-07" }
  - { name: Talviloma, from: "2028-02-21", to: "2028-02-25" }
  - { name: Kesäloma, from: "2028-06-04", to: "2028-08-09" }

attendance:
  enabled: true
  children: [Oliver, Oskar]
  poll: { days: [sun], time: "19:00" }
  apply: { days: [mon], time: "06:15" }
  live: true    # verified 2026-10-22 with myclub-signup-test (no-op re-confirm)
  # Where the poll looks for unanswered events (logged-in MyClub pages; the
  # "Ei vastausta" feed misses most of them). Viima Hockey left out: hundreds of open sessions.
  clubs:
    - { host: ppj.myclub.fi, child: Oskar }
    - { host: ppj.myclub.fi, child: Oliver }
    - { host: kiekko-espoo.myclub.fi, child: Oliver }

outlook:
  enabled: true
  runs:
    - { days: [mon, tue, wed, thu, fri, sat, sun], time: "06:20" }
  remind_days_before: 3
  # Bills from Henri's private mail. OPEN: post them to the family group, or
  # only to Henri's private chat with the bot (set TELEGRAM_PRIVATE_CHAT_ID).
  # none (2026-10-25): bills stay out of the family group (Anna is in it); the
  # Chief of staff's 06:50 bill reminder sends them to Henri's DM.
  bills_to: none   # family | private_if_set | none
  scan_lookback_days: 14
  # Wilma's notification emails skip the inbox (Henri: too much noise); the
  # agent keeps an Outlook rule that files them, read, in this folder.
  wilma_folder: { name: Wilma, senders: [inschool.fi] }
  # OpenClaw Email agent (Henri, 2026-10-23): reads, sorts and drafts; sends a
  # reply only after Henri taps Allow in Telegram (openclaw/README.md).
  # send: on since 2026-10-24 (Mail.Send granted, first send verified). Each
  # send still waits for Henri's Allow tap in Telegram (mail-approval plugin).
  email_agent:
    send: true
    self: [henri.jantti@outlook.com]
