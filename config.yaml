# Family agent settings. Nothing secret goes here: passwords, tokens and keys
# are environment secrets (see .env.example and docs/SETUP.md).
timezone: Europe/Helsinki

# Children as they should appear in calendar titles and the digest.
# `match` is matched (case-insensitive, start of name) against the names Wilma
# and MyClub show. Leave empty to use the first name each source gives.
children:
  - name: Oliver
    match: [Oliver, PPj]   # MyClub calendar subscription "PPj" (assumed Oliver's team)
  - name: Oskar
    match: [Oskar]

calendar:
  # Google calendar ids (Settings > the calendar > "Integrate calendar").
  # Ids are not secret, but they come from env vars so this file stays generic.
  family_calendar_id_env: GOOGLE_FAMILY_CALENDAR_ID   # human-owned, agent reads only
  school_calendar_id_env: GOOGLE_SCHOOL_CALENDAR_ID   # "Family: School (Wilma)", agent writes
  hobbies_calendar_id_env: GOOGLE_HOBBIES_CALENDAR_ID # "Family: Hobbies (MyClub)", agent writes
  missing_runs_before_delete: 2
  max_deletes_per_run: 5

digest:
  language: fi            # en | fi (Henri, 2026-10-22)
  weekday_time: "06:45"
  weekend_time: "06:45"   # every day incl. weekends (Henri, 2026-10-22)
  week_ahead: { day: sun, time: "19:00" }
  coming_up_days: 7

alerts:
  quiet_hours: { from: "21:00", to: "06:30" }
  exam_soon_days: 3

wilma:
  enabled: false   # ON HOLD (Henri, 2026-10-22) until the laptop runner is installed
  include_grades: false   # OPEN DECISION: default off (most sensitive data, never sent to Telegram)
  # 3-4 runs a day: every fresh login logs Henri out of Wilma in his browser.
  # The saved session is reused between runs to soften this.
  runs:
    - { days: [mon, tue, wed, thu, fri], time: "06:30" }
    - { days: [mon, tue, wed, thu, fri], time: "12:00", alerts: true }
    - { days: [mon, tue, wed, thu, fri], time: "16:00", alerts: true }
    - { days: [sun], time: "18:45" }
  bulletin_events: true   # dated bulletin items go to the School calendar as tentative

myclub:
  enabled: true
  runs:
    - { days: [mon, tue, wed, thu, fri, sat, sun], time: "06:15" }
  horizon_weeks: 6
  # UNVERIFIED until the feasibility check with Henri. Either an ICS feed
  # (secret MYCLUB_ICS_URL) or the member pages read as Henri.
  mode: auto              # auto | ics | pages
  base_url: https://myclub.fi

# Weekly practice question. Sunday evening the bot posts a poll per child with
# next week's MyClub events; Monday morning the agent signs the ticked ones up
# in MyClub and declines the rest, then posts what it did. A poll nobody
# answered changes nothing. `live: false` = report only, until the MyClub
# sign-up step has been checked against the real pages.
attendance:
  enabled: true
  children: [Oliver, Oskar]
  poll: { days: [sun], time: "19:00" }
  apply: { days: [mon], time: "06:15" }
  live: true    # verified 2026-10-22 with myclub-signup-test (no-op re-confirm)
  # Where the poll looks for unanswered events (logged-in MyClub pages; the
  # "Ei vastausta" feed misses most of them). Viima Hockey left out: hundreds of open sessions.
  clubs:
    - { host: ppj.myclub.fi, child: Oskar }
    - { host: ppj.myclub.fi, child: Oliver }
    - { host: kiekko-espoo.myclub.fi, child: Oliver }

outlook:
  enabled: true
  runs:
    - { days: [mon, tue, wed, thu, fri, sat, sun], time: "06:20" }
  remind_days_before: 3
  # Bills from Henri's private mail. OPEN: post them to the family group, or
  # only to Henri's private chat with the bot (set TELEGRAM_PRIVATE_CHAT_ID).
  bills_to: private_if_set   # family | private_if_set
  scan_lookback_days: 14
  # Wilma's notification emails skip the inbox (Henri: too much noise); the
  # agent keeps an Outlook rule that files them, read, in this folder.
  wilma_folder: { name: Wilma, senders: [inschool.fi] }
  # Email assistant (Henri, 2026-10-22: send on approval). On each Outlook run
  # it finds new mail that asks Henri something, saves a reply draft in Drafts
  # and posts it to his private Telegram chat with Send / Skip buttons. Button
  # presses are read on every tick. Needs TELEGRAM_PRIVATE_CHAT_ID.
  assistant:
    enabled: false
    # Send stays off until Mail.Send is added to the Entra app and the
    # "outlook-login" helper is run again; until then Send only confirms.
    send: false
    writer: claude          # claude (needs ANTHROPIC_API_KEY) | manual (Henri types the reply in Telegram)
    model: claude-opus-5-5
    max_per_run: 5
    lookback_days: 3
    self: [henri.jantti@outlook.com]
    signature: "Terveisin, Henri"
