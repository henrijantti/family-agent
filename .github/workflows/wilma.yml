# Fetches Wilma from Henri's laptop (self-hosted runner, label "wilma").
# Wilma's Cloudflare protection refuses GitHub's datacenter addresses, so only
# this fetch runs at home; it saves an encrypted snapshot on the `state-wilma`
# branch and the "Family agent" workflow does everything else from it.
# Times: 20 min before each Wilma slot in config.yaml (06:10, 11:40, 15:40
# weekdays, 18:25 Sunday, Helsinki), for both summer and winter time. If the
# laptop is off, the run waits in the queue and is skipped once it is late.
name: Wilma fetch (laptop)

on:
  schedule:
    - cron: "10,40 3,4,8,9,12,13,15,16 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch now even if no slot is due"
        type: boolean
        default: true

concurrency:
  group: family-agent-wilma
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  fetch:
    runs-on: [self-hosted, wilma]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Load Wilma state
        run: bash scripts/state.sh load-wilma
      - name: Fetch
        run: npm run --silent agent -- wilma-fetch ${FORCE:+--force}
        env:
          FORCE: ${{ inputs.force && 'yes' || '' }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          WILMA_TENANT: ${{ secrets.WILMA_TENANT }}
          WILMA_USERNAME: ${{ secrets.WILMA_USERNAME }}
          WILMA_PASSWORD: ${{ secrets.WILMA_PASSWORD }}
          WILMA_TOTP_SECRET: ${{ secrets.WILMA_TOTP_SECRET }}
      - name: Save Wilma state
        if: always()
        run: bash scripts/state.sh save-wilma
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Clean up
        if: always()
        run: rm -rf state
