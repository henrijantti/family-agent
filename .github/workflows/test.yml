name: Tests
on:
  push:
    branches-ignore: [state]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Shellcheck server scripts
        run: shellcheck -S warning server/*.sh server/save-bot-token server/openclaw-install-policy scripts/*.sh
